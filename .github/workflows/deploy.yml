name: CI/CD Pipeline — Amrutha Juice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_FRONTEND_REPO: lokesh-frontend
  ECR_BACKEND_REPO: lokesh-backend
  ECS_CLUSTER: lokesh-cluster
  FRONTEND_SERVICE: lokesh-frontend-service
  BACKEND_SERVICE: lokesh-backend-service
  FRONTEND_CONTAINER: frontend
  BACKEND_CONTAINER: backend

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — CODE QUALITY (SonarQube)
  # ─────────────────────────────────────────
  sonarqube:
    name: 🔍 SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests \
            --coverageReporters=lcov --coverageDirectory=coverage
        continue-on-error: true

      - name: SonarQube Scan — Frontend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=amrutha-juice-frontend
            -Dsonar.projectName="Amrutha Juice Frontend"
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: SonarQube Scan — Backend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=amrutha-juice-backend
            -Dsonar.projectName="Amrutha Juice Backend"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ─────────────────────────────────────────
  # JOB 2 — DEPENDENCY SECURITY SCAN
  # ─────────────────────────────────────────
  dependency-scan:
    name: 🔐 Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Frontend — npm audit
        run: |
          cd frontend && npm install
          npm audit --audit-level=high --json > npm-audit-frontend.json || true
          npm audit --audit-level=high || true

      - name: Backend — npm audit
        run: |
          cd backend && npm install
          npm audit --audit-level=high --json > npm-audit-backend.json || true
          npm audit --audit-level=high || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            frontend/npm-audit-frontend.json
            backend/npm-audit-backend.json
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 3 — BUILD DOCKER IMAGES
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    outputs:
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      backend-image: ${{ steps.build-backend.outputs.image }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────
  # JOB 4 — TRIVY SECURITY SCAN
  # ─────────────────────────────────────────
  trivy-scan:
    name: 🛡️ Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull frontend image
        run: docker pull ${{ needs.build.outputs.frontend-image }}

      - name: Pull backend image
        run: docker pull ${{ needs.build.outputs.backend-image }}

      - name: Trivy — Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret,misconfig'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          trivy-config: ''

      - name: Trivy — Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ needs.build.outputs.frontend-image }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivy-config: ''

      - name: Trivy — Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ needs.build.outputs.backend-image }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivy-config: ''

      - name: Trivy — Backend Image Report (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ needs.build.outputs.backend-image }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivy-config: ''

      - name: Upload Trivy Frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
        continue-on-error: true

      - name: Upload Trivy Backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
        continue-on-error: true

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports
          path: |
            trivy-frontend.sarif
            trivy-backend.sarif
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 5 — DEPLOY TO AWS ECS
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [sonarqube, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image-tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "frontend=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "backend=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition lokesh-frontend \
            --query taskDefinition > frontend-task-def.json

      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition lokesh-backend \
            --query taskDefinition > backend-task-def.json

      - name: Inject backend environment variables
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 - <<'EOF'
          import json, os
          with open('backend-task-def.json') as f:
              td = json.load(f)
          updates = {
              'PORT': '5000',
              'NODE_ENV': 'production',
              'DB_HOST': os.environ['DB_HOST'],
              'DB_USER': os.environ['DB_USER'],
              'DB_PASSWORD': os.environ['DB_PASSWORD'],
              'DB_NAME': os.environ.get('DB_NAME', 'lokeshdb'),
              'DB_PORT': '3306',
              'JWT_SECRET': os.environ['JWT_SECRET'],
              'CLIENT_URL': 'https://lokeshwaffle.in',
              'SMTP_USER': os.environ['SMTP_USER'],
              'SMTP_PASS': os.environ['SMTP_PASS'],
              'FROM_EMAIL': os.environ['SMTP_USER'],
          }
          env = td['containerDefinitions'][0].get('environment', [])
          env = [e for e in env if e['name'] not in updates]
          env += [{'name': k, 'value': v} for k, v in updates.items()]
          td['containerDefinitions'][0]['environment'] = env
          with open('backend-task-def.json', 'w') as f:
              json.dump(td, f)
          print('Env vars injected successfully')
          EOF

      - name: Update frontend task definition with new image
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ steps.image-tags.outputs.frontend }}

      - name: Update backend task definition with new image
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ steps.image-tags.outputs.backend }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Deployment Summary
        run: |
          echo "================================================"
          echo "  AMRUTHA JUICE — DEPLOYMENT COMPLETE!"
          echo "================================================"
          echo "  Website : https://lokeshwaffle.in"
          echo "  API     : https://lokeshwaffle.in/api/health"
          echo "  DB      : MySQL RDS"
          echo "================================================"
